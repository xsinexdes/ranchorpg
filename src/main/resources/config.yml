# RanchoRPG - configuración. Se edita desde el juego: /rancho admin
seasons:
  world: world
  use-real-time: false
  length-days: 7
  title: true
  offset:
    spring: 0.0
    summer: 8.0
    autumn: -2.0
    winter: -14.0

events:
  harvest:
    enabled: true
    chance: 15.0
    duration-days: 2
  frost:
    enabled: true
    chance: 15.0
    duration-days: 2
    temp-offset: -10.0
  heatwave:
    enabled: true
    chance: 15.0
    duration-days: 2
    temp-offset: 10.0
  drought:
    enabled: true
    chance: 10.0
    duration-days: 2
  flood:
    enabled: true
    chance: 12.0
    duration-days: 2
  locusts:
    enabled: true
    chance: 10.0
    duration-days: 2

temperature:
  biome-scale: 25.0
  biome-offset: -5.0
  day-amplitude: 4.0
  rain-offset: -4.0
  thunder-offset: -5.0
  lava-bonus: 6.0
  fire-bonus: 4.0
  torch-bonus: 1.0
  ice-bonus: -3.0
  water-bonus: -1.0
  scan-radius: 3
  players:
    enabled: false
    cold-threshold: -2.0
    heat-threshold: 40.0

animals:
  time-scale: 1.0
  level-days: 2.0
  breed-min-happiness: 70.0
  vaccine-days: 5.0
  disease-chance: 1.0
  manure-days: 0.3
  overgraze-chance: 0.02
  hologram: true
  hologram-range: 40.0
  actionbar: false
  owner-lock: false
  # Los animales que aparecen en la naturaleza pueden ser salvajes (atacan hasta que los domas con comida)
  wild-enabled: true
  wild-range: 6.0
  max-per-pass: 80

genetics:
  mutation-chance: 0.1
  serum-positive: 0.65
  max-mutations: 5
  horse-cap-health: 60.0
  horse-cap-speed: 0.35
  horse-cap-jump: 1.0

crops:
  time-scale: 1.0
  growth-multiplier: 1.0
  water-decay-per-day: 60.0
  wither-days: 1.0
  can-uses: 20
  greenhouse-radius: 6
  pot-radius: 2
  pest-chance: 0.12
  scarecrow-radius: 8
  sprinkler-radius: 4
  sprinkler-interval: 90
  max-per-pass: 300
  max-catchup-days: 0.5

economy:
  use-vault: true

farmer:
  xp-multiplier: 1.0
  xp:
    feed: 2.0
    cure: 15.0
    produce: 5.0
    breed: 10.0
    birth: 20.0
    plant: 1.0
    harvest: 3.0
    cook: 3.0
    fish: 4.0
    tame: 25.0

food:
  # Multiplica el tiempo que tarda en pudrirse la comida (2.0 = dura el doble)
  spoil-multiplier: 1.0

machines:
  hive-hours: 1.0
  # Carga (0-100) necesaria para extraer una botella de miel
  honey-charge: 40.0
  waterer-freezes: true
  # Velocidad a la que se pudre la comida dentro de la nevera (0.1 = 10 veces más lento)
  fridge-spoil-factor: 0.1

fair:
  enabled: false
  interval-hours: 3.0
  duration-minutes: 10
  prize:
    '1': 500
    '2': 250
    '3': 100
  xp:
    '1': 100
    '2': 60
    '3': 30

visuals:
  # Muestra los modelos 3D de las mesas y máquinas (necesita el resource pack RanchoRPG-ResourcePack.zip)
  enabled: true
  range: 48.0
  yaw-offset: 0.0
  # Interfaces con fondo medieval pintado y título con tipografía propia (solo Paper, necesitan el pack)
  gui: true
  # Usarlas aunque el plugin no detecte el pack (por ejemplo si lo envías desde server.properties)
  gui-for-all: false
  season-particles: true
  animal-effects: true
  mature-sparkle: true
  send-on-join: true
  resource-pack-url: ''
  resource-pack-sha1: ''
  resource-pack-prompt: '&6RanchoRPG: pack con modelos 3D de las mesas'
  resource-pack-force: false
  models:
    kitchen: 7001
    cask: 7002
    mill: 7003
    fridge: 7004
    sprinkler: 7005
    scarecrow: 7006
    hive: 7007
    aquarium: 7008
    feeder: 7009
    waterer: 7010
    greenhouse: 7011
    pot: 7012
    mill_wheel: 7103
    sprinkler_head: 7105

hud:
  # Dónde mostrar estación, día, clima, temperatura y hora: SIDEBAR (panel lateral), ACTIONBAR, BOSSBAR u OFF
  mode: SIDEBAR
  update-seconds: 2.0

weather:
  # Minutos reales de lluvia seguida hasta que los campos se inundan
  flood-minutes: 8

fishing:
  # El pez se saca con un juego de empuje (click derecho para subir la zona verde)
  minigame: true
  minigame-seconds: 20

difficulty:
  # 1.0 = calidad lineal; cuanto más alto, más difícil llegar a los niveles altos
  quality-hardness: 1.8

meta:
  config-version: 2
